<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenTunnel Client</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #121212;
      --panel: #1c1c1c;
      --panel-border: #2e2e2e;
      --text: #e8e8e8;
      --muted: #9a9a9a;
      --link: #d6d6d6;
      --btn-primary-bg: #e8e8e8;
      --btn-primary-fg: #141414;
      --danger-fg: #e8a0a0;
      --danger-border: #6b4040;
      --ok-fg: #a8c8a0;
      --ok-bg: #252825;
      --err-bg: #282424;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f0f0f0;
        --panel: #fafafa;
        --panel-border: #ddd;
        --text: #1a1a1a;
        --muted: #666;
        --link: #333;
        --btn-primary-bg: #262626;
        --btn-primary-fg: #fafafa;
        --danger-fg: #9a3030;
        --danger-border: #d4a0a0;
        --ok-fg: #2d5a2d;
        --ok-bg: #eef4ee;
        --err-bg: #faf0f0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.35;
    }
    main { max-width: 880px; margin: 0 auto; padding: 0.75rem 1rem 1rem; }
    h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.15rem; letter-spacing: -0.01em; }
    .sub { color: var(--muted); margin: 0 0 0.65rem; font-size: 0.923em; }
    section {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      margin-bottom: 0.55rem;
    }
    h2 {
      font-size: 0.769em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin: 0 0 0.4rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: inherit; }
    th, td {
      text-align: left;
      padding: 0.3rem 0.25rem;
      border-bottom: 1px solid var(--panel-border);
      vertical-align: middle;
    }
    th { color: var(--muted); font-weight: 500; font-size: 0.846em; }
    tr:last-child td { border-bottom: none; }
    a { color: var(--link); text-decoration: underline; text-underline-offset: 2px; }
    a:hover { color: var(--text); }
    form { display: grid; gap: 0.45rem; }
    label { display: grid; gap: 0.15rem; font-size: 0.846em; color: var(--muted); }
    input, select, button {
      font: inherit;
      padding: 0.3rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--panel-border);
      background: var(--bg);
      color: inherit;
    }
    input:focus, select:focus {
      outline: 1px solid var(--muted);
      outline-offset: 0;
    }
    button {
      cursor: pointer;
      background: var(--btn-primary-bg);
      border: 1px solid transparent;
      color: var(--btn-primary-fg);
      font-weight: 500;
    }
    button:hover { filter: brightness(0.95); }
    button.secondary {
      background: transparent;
      border-color: var(--panel-border);
      color: inherit;
    }
    button.danger {
      background: transparent;
      border-color: var(--danger-border);
      color: var(--danger-fg);
    }
    td .actions { display: flex; flex-wrap: wrap; gap: 0.25rem; }
    td button { padding: 0.15rem 0.35rem; font-size: 0.846em; }
    .row { display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: end; }
    .row > * { flex: 1 1 120px; }
    .row-actions { flex: 0 0 auto; }
    .row-actions button { min-width: 4.5rem; }
    .status-line {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.846em;
      white-space: pre-wrap;
      margin: 0;
    }
    .status-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
    .flash {
      padding: 0.4rem 0.55rem;
      border-radius: 4px;
      margin-bottom: 0.55rem;
      display: none;
      font-size: 0.923em;
      border: 1px solid var(--panel-border);
    }
    .flash.ok { display: block; background: var(--ok-bg); color: var(--ok-fg); }
    .flash.err { display: block; background: var(--err-bg); color: var(--danger-fg); }
    code { font-size: 0.923em; }
    section .sub { margin-bottom: 0.45rem; }
  </style>
</head>
<body>
  <main>
    <h1>OpenTunnel Client</h1>
    <p class="sub">查看隧道状态，管理本地 route（增删改）。</p>

    <div id="flash" class="flash"></div>

    <section id="token-row">
      <h2>访问令牌</h2>
      <p class="sub">若容器设置了 <code>OT_CLIENT_ADMIN_TOKEN</code>，在此填写后保存到浏览器。</p>
      <div class="row">
        <label style="flex:2">Admin token
          <input id="admin-token" type="password" placeholder="Bearer token（可选）" autocomplete="off" />
        </label>
        <div class="row-actions"><button type="button" class="secondary" id="save-token">保存</button></div>
      </div>
    </section>

    <section>
      <h2>隧道状态</h2>
      <div class="status-bar">
        <div id="status" class="status-line">加载中…</div>
        <button type="button" class="secondary" id="refresh">刷新</button>
      </div>
    </section>

    <section>
      <h2>Routes</h2>
      <table>
        <thead>
          <tr><th>名称</th><th>目标</th><th>公网 URL</th><th></th></tr>
        </thead>
        <tbody id="routes"></tbody>
      </table>
    </section>

    <section>
      <h2 id="form-title">添加 route</h2>
      <form id="route-form">
        <input type="hidden" id="edit-mode" value="add" />
        <div class="row">
          <label>名称（可选，小写 DNS 标签或 @）
            <input id="name" name="name" placeholder="留空则随机 16 字符" pattern="^@?$|^[a-z0-9-]+$" />
          </label>
          <label>目标 host:port
            <input id="target" name="target" required placeholder="127.0.0.1:3000 或 3000" />
          </label>
          <label>PROXY protocol
            <select id="proxy_protocol" name="proxy_protocol">
              <option value="">关闭</option>
              <option value="v1">v1</option>
              <option value="v2">v2</option>
            </select>
          </label>
        </div>
        <div class="row">
          <div class="row-actions"><button type="submit" id="submit-btn">添加</button></div>
          <div class="row-actions"><button type="button" class="secondary" id="cancel-edit" hidden>取消编辑</button></div>
        </div>
      </form>
    </section>
  </main>
  <script>
    const TOKEN_KEY = "ot-client-admin-token";

    function token() {
      return localStorage.getItem(TOKEN_KEY) || "";
    }

    function headers() {
      const h = { "Content-Type": "application/json" };
      const t = token();
      if (t) h["Authorization"] = "Bearer " + t;
      return h;
    }

    function flash(msg, ok) {
      const el = document.getElementById("flash");
      el.textContent = msg;
      el.className = "flash " + (ok ? "ok" : "err");
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, { ...opts, headers: { ...headers(), ...(opts.headers || {}) } });
      const data = await res.json().catch(() => ({}));
      if (!res.ok && res.status === 401) throw new Error("未授权：请填写正确的 Admin token");
      return { res, data };
    }

    function renderStatus(data) {
      const lines = [];
      if (data.profile) lines.push("Profile: " + data.profile);
      if (data.tunnel_id) lines.push("Tunnel ID: " + data.tunnel_id);
      if (data.hostname) lines.push("Hostname: " + data.hostname);
      if (data.connected) lines.push(data.connected);
      if (data.service) lines.push("Service: " + data.service);
      if (!lines.length) lines.push(data.raw || "（无状态）");
      document.getElementById("status").textContent = lines.join("\n");
    }

    function renderRoutes(routes) {
      const tbody = document.getElementById("routes");
      tbody.innerHTML = "";
      if (!routes.length) {
        tbody.innerHTML = "<tr><td colspan=\"4\">暂无 route</td></tr>";
        return;
      }
      for (const r of routes) {
        const tr = document.createElement("tr");
        const url = r.url ? `<a href="${r.url}" target="_blank" rel="noopener">${r.url}</a>` : "—";
        tr.innerHTML = `
          <td><code>${escapeHtml(r.name)}</code></td>
          <td><code>${escapeHtml(r.target)}</code></td>
          <td>${url}</td>
          <td><div class="actions">
            <button type="button" class="secondary edit" data-name="${escapeAttr(r.name)}" data-target="${escapeAttr(r.target)}">编辑</button>
            <button type="button" class="danger del" data-name="${escapeAttr(r.name)}">删除</button>
          </div></td>`;
        tbody.appendChild(tr);
      }
      tbody.querySelectorAll(".edit").forEach(btn => btn.addEventListener("click", () => startEdit(btn.dataset.name, btn.dataset.target)));
      tbody.querySelectorAll(".del").forEach(btn => btn.addEventListener("click", () => removeRoute(btn.dataset.name)));
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
    }
    function escapeAttr(s) {
      return String(s).replace(/"/g, "&quot;");
    }

    function startEdit(name, target) {
      document.getElementById("edit-mode").value = "edit";
      document.getElementById("form-title").textContent = "修改 route";
      document.getElementById("name").value = name;
      document.getElementById("name").readOnly = true;
      document.getElementById("target").value = target;
      document.getElementById("submit-btn").textContent = "保存";
      document.getElementById("cancel-edit").hidden = false;
    }

    function resetForm() {
      document.getElementById("edit-mode").value = "add";
      document.getElementById("form-title").textContent = "添加 route";
      document.getElementById("route-form").reset();
      document.getElementById("name").readOnly = false;
      document.getElementById("submit-btn").textContent = "添加";
      document.getElementById("cancel-edit").hidden = true;
    }

    async function refresh() {
      try {
        const { data: st } = await api("/api/status");
        renderStatus(st);
        const { data: rt } = await api("/api/routes");
        renderRoutes(rt.routes || []);
      } catch (e) {
        flash(e.message || String(e), false);
      }
    }

    async function removeRoute(name) {
      if (!confirm("删除 route「" + name + "」？")) return;
      try {
        const { res, data } = await api("/api/routes/" + encodeURIComponent(name), { method: "DELETE" });
        flash(data.output || (data.ok ? "已删除" : "删除失败"), data.ok);
        if (res.ok) await refresh();
      } catch (e) {
        flash(e.message || String(e), false);
      }
    }

    document.getElementById("route-form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const payload = {
        target: document.getElementById("target").value.trim(),
        name: document.getElementById("name").value.trim() || undefined,
        proxy_protocol: document.getElementById("proxy_protocol").value || undefined,
      };
      try {
        const { res, data } = await api("/api/routes", {
          method: "POST",
          body: JSON.stringify(payload),
        });
        const msg = data.url ? "已保存，公网 URL: " + data.url : (data.output || (data.ok ? "已保存" : "失败"));
        flash(msg, data.ok);
        if (res.ok || data.ok) {
          resetForm();
          await refresh();
        }
      } catch (e) {
        flash(e.message || String(e), false);
      }
    });

    document.getElementById("refresh").addEventListener("click", refresh);
    document.getElementById("cancel-edit").addEventListener("click", resetForm);
    document.getElementById("save-token").addEventListener("click", () => {
      localStorage.setItem(TOKEN_KEY, document.getElementById("admin-token").value.trim());
      flash("Token 已保存", true);
      refresh();
    });

    document.getElementById("admin-token").value = token();
    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
