# 从「只跑 opentunnel serve + 三个宿主机目录」的旧容器迁移时用这份。
# 不要用 docker-compose.yml（那是新建安装，只用 /data 卷）。
#
# 使用前：把 OPENTUNNEL_API 改成你的 relay；确认宿主机目录里有 default.toml 和 default/tunnel.json。
services:
  opentunnel-client:
    image: ghcr.io/arnochenfx/opentunnel-aio-relay/opentunnel-client:latest
    container_name: opentunnel-client
    restart: unless-stopped
    ports:
      - "9080:9080"
    environment:
      OPENTUNNEL_API: https://tunnel.example.com
      OPENTUNNEL_PROFILE: default
      OT_CLIENT_ADMIN_PORT: "9080"
      # OT_CLIENT_ADMIN_TOKEN: change-me
      # OPENTUNNEL_CA_CERT: /data/ca.pem
      XDG_CONFIG_HOME: /root/.config
      XDG_DATA_HOME: /root/.local/share
      XDG_STATE_HOME: /root/.local/state
    volumes:
      - ./opentunnel-config:/root/.config/opentunnel
      - ./opentunnel-data:/root/.local/share/opentunnel
      - ./opentunnel-state:/root/.local/state/opentunnel
    extra_hosts:
      - "host.docker.internal:host-gateway"
