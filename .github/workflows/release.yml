name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Weekly (Mondays): unit tests + release builds + the official-client E2E
    # below. Weekly keeps the Let's Encrypt and Cloudflare usage low.
    - cron: '17 3 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - name: Test official client fetch script (offline)
        run: bash .github/scripts/test-fetch-official-client.sh

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              sudo apt-get install -y -qq musl-tools
              ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y -qq gcc-aarch64-linux-gnu
              ;;
          esac

      - name: Sync version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version in tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("Cargo.toml")
          text = path.read_text()
          text, count = re.subn(r'(?m)^version = "[^\"]+"$', f'version = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit("Could not locate the package version in Cargo.toml")
          path.write_text(text)
          PY
          cargo update --workspace
          cargo metadata --locked --no-deps --format-version=1 >/dev/null
          grep -m1 '^version' Cargo.toml

      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          STAGE="dist/opentunnel-relay-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/opentunnel-relay" "$STAGE/"
          cp README.md "$STAGE/"
          tar -czf "dist/opentunnel-relay-${{ matrix.target }}.tar.gz" -C dist "opentunnel-relay-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No point republishing `latest` on the weekly schedule with no new code.
    if: github.event_name != 'schedule'
    steps:
      # NOTE: checkout first! actions/checkout runs `git clean -ffdx` by
      # default, which would wipe the downloaded artifacts below.
      # Keep the floating `latest` tag on the commit that produced it.
      # Credentials persist on purpose: the `git push` in "Move latest tag"
      # needs them.
      - uses: actions/checkout@v5
        if: github.ref_type != 'tag'
        with:
          fetch-depth: 0
      - name: Move latest tag
        if: github.ref_type != 'tag'
        run: |
          git tag -f latest ${{ github.sha }}
          git push -f origin latest

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum *.tar.gz > sha256sums.txt && cat sha256sums.txt)

      - name: Classify release tag
        id: release-class
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%+*}"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          prerelease: ${{ github.ref_type != 'tag' || steps.release-class.outputs.prerelease == 'true' }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' && steps.release-class.outputs.prerelease != 'true' && 'true' || 'false' }}
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt

  integration:
    name: Integration (official client E2E)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Serialized: two runs would fight over the same DNS-01 TXT record.
    concurrency:
      group: opentunnel-integration
      cancel-in-progress: false
    # Real Let's Encrypt issuance happens here (2 certs per run). Each run gets
    # its own hostname, run-<run id>-<attempt>.<CI_DOMAIN>, because Let's
    # Encrypt allows only 5 certs per identical name set per week. Let's
    # Encrypt also allows 50 certs per registered domain per week, so this runs
    # on tags, the weekly schedule, and manual dispatch -- not on every push.
    #
    if: >-
      ${{ github.ref_type == 'tag' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' }}
    env:
      # Official client release under test. "latest" tracks upstream's newest
      # release so incompatibilities surface quickly. Set a tag such as
      # "v0.4.0" for a reproducible run. Either way the download is checked
      # against the digest GitHub publishes for that release's asset.
      OFFICIAL_CLIENT_RELEASE: latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check integration credentials
        id: integration-secrets
        env:
          CI_CF_TOKEN: ${{ secrets.CI_CF_TOKEN }}
        run: |
          if [[ -n "$CI_CF_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: relay-dist

      - name: Download official client release
        if: steps.integration-secrets.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch-official-client.sh

      - name: Official client <-> our relay, end to end
        if: steps.integration-secrets.outputs.available == 'true'
        env:
          CI_DOMAIN: ${{ secrets.CI_DOMAIN }}
          CI_CF_TOKEN: ${{ secrets.CI_CF_TOKEN }}
          CI_CF_ZONE_ID: ${{ secrets.CI_CF_ZONE_ID }}
        run: |
          tar -xzf relay-dist/opentunnel-relay-x86_64-unknown-linux-gnu.tar.gz -C /tmp
          RELAY_BIN=/tmp/opentunnel-relay-x86_64-unknown-linux-gnu/opentunnel-relay \
          CLIENT_BIN=/tmp/official-client/opentunnel \
          bash .github/scripts/integration-test.sh
