name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Daily: unit tests + release builds + the official-client E2E below.
    - cron: '17 3 * * *'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              sudo apt-get install -y -qq musl-tools
              ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y -qq gcc-aarch64-linux-gnu
              ;;
          esac

      - name: Sync version from tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version in tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          path = pathlib.Path("Cargo.toml")
          text = path.read_text()
          text, count = re.subn(r'(?m)^version = "[^\"]+"$', f'version = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit("Could not locate the package version in Cargo.toml")
          path.write_text(text)
          PY
          cargo update --workspace
          cargo metadata --locked --no-deps --format-version=1 >/dev/null
          grep -m1 '^version' Cargo.toml

      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        run: |
          STAGE="dist/opentunnel-relay-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/opentunnel-relay" "$STAGE/"
          cp README.md "$STAGE/"
          tar -czf "dist/opentunnel-relay-${{ matrix.target }}.tar.gz" -C dist "opentunnel-relay-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # No point republishing `latest` on the daily schedule with no new code.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && sha256sum *.tar.gz > sha256sums.txt && cat sha256sums.txt)

      # Keep the floating `latest` tag on the commit that produced it.
      - uses: actions/checkout@v4
        if: github.ref_type != 'tag'
        with:
          fetch-depth: 0
      - name: Move latest tag
        if: github.ref_type != 'tag'
        run: |
          git tag -f latest ${{ github.sha }}
          git push -f origin latest

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt

  integration:
    name: Integration (official client E2E)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialized: two runs would fight over the same DNS-01 TXT record.
    concurrency:
      group: opentunnel-integration
      cancel-in-progress: false
    # Real Let's Encrypt issuance happens here (2 certs per run on CI_DOMAIN:
    # one for the API domain, one for the tunnel). Let's Encrypt allows 50
    # certs per registered domain per week, so this runs on tags, the daily
    # schedule, and manual dispatch -- not on every push.
    #
    # NOTE: `secrets` cannot appear in a job-level `if:` (GitHub rejects the
    # whole file with "Unrecognized named-value: 'secrets'"). The secret is
    # mapped to env below and the E2E step is gated on the env var instead;
    # without the secret the job succeeds with that step skipped.
    if: >-
      ${{ github.ref_type == 'tag' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' }}
    env:
      # Which official client release to test against. "latest" tracks
      # upstream's newest release so incompatibilities surface fast; pin a
      # version like "v0.4.0" for reproducible runs.
      OFFICIAL_CLIENT_RELEASE: latest
      CI_CF_TOKEN: ${{ secrets.CI_CF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-gnu
          path: relay-dist

      - name: Download official client release
        if: env.CI_CF_TOKEN != ''
        run: |
          if [ "${OFFICIAL_CLIENT_RELEASE}" = "latest" ]; then
            URL="https://github.com/anomalyco/opentunnel/releases/latest/download/opentunnel-linux-x64.tar.gz"
          else
            URL="https://github.com/anomalyco/opentunnel/releases/download/${OFFICIAL_CLIENT_RELEASE}/opentunnel-linux-x64.tar.gz"
          fi
          curl -fsSL -o /tmp/official-client.tgz "$URL"
          mkdir -p /tmp/official-client && tar -xzf /tmp/official-client.tgz -C /tmp/official-client
          /tmp/official-client/opentunnel --version

      - name: Official client <-> our relay, end to end
        if: env.CI_CF_TOKEN != ''
        env:
          CI_DOMAIN: ${{ secrets.CI_DOMAIN }}
          CI_CF_TOKEN: ${{ secrets.CI_CF_TOKEN }}
          CI_CF_ZONE_ID: ${{ secrets.CI_CF_ZONE_ID }}
        run: |
          tar -xzf relay-dist/opentunnel-relay-x86_64-unknown-linux-gnu.tar.gz -C /tmp
          RELAY_BIN=/tmp/opentunnel-relay-x86_64-unknown-linux-gnu/opentunnel-relay \
          CLIENT_BIN=/tmp/official-client/opentunnel \
          bash .github/scripts/integration-test.sh
