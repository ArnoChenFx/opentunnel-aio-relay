name: Client Docker (GHCR)

on:
  push:
    branches: [master]
    tags: ['v*']
    paths:
      - 'docker/client/**'
      - '.github/workflows/client-docker-ghcr.yml'
  workflow_dispatch:
    inputs:
      opentunnel_version:
        description: Official opentunnel client release (e.g. 0.6.1 or latest)
        required: false
        default: '0.6.1'
      push:
        description: Push to GHCR (disable to build only)
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR package: ghcr.io/<owner>/<repo>/opentunnel-client (lowercased at push)
  IMAGE: ghcr.io/${{ github.repository }}/opentunnel-client
  OPENTUNNEL_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.opentunnel_version || '0.6.1' }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lowercase image name
        id: image
        run: |
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/client/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENTUNNEL_VERSION=${{ env.OPENTUNNEL_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
